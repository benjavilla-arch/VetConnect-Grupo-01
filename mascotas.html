<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mascotas - VetConnect</title>
  <link rel="stylesheet" href="Veterinaria/css/style.css">
</head>
<body>
  <header>
    <h1>Mascotas</h1>
  </header>
  <nav>
    <a href="Veterinaria/index.html">Inicio</a>
    <a href="Veterinaria/contacto.html">Contacto</a>
    <a href="mascotas.html">Mascotas</a>
  </nav>
  <main>
    <form>
      <label for="nombre-mascota">Nombre de la mascota</label>
      <input type="text" id="nombre-mascota" name="nombre-mascota">

      <label for="tipo">Tipo</label>
      <input type="text" id="tipo" name="tipo">

      <label for="edad">Edad</label>
      <input type="number" id="edad" name="edad" min="0">

      <label for="dueno">Dueño</label>
      <input type="text" id="dueno" name="dueno">

      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" name="telefono">

      <label for="observaciones">Observaciones</label>
      <textarea id="observaciones" name="observaciones"></textarea>

      <button type="submit">Guardar</button>
    </form>
  </main>
</body>
</html>
